# Own plugin: ask an LLM straight from the bar.
#
# The one thing that sets it apart from the community AI plugins is that it
# **stores no API key**: the key is read from /run/secrets/deepseek-api-key,
# decrypted by sops, and never lands in noctalia's runtime state files. mimir
# and deepseek_usage were dropped precisely because they wrote the key in clear
# text into settings.toml.
#
# Structure follows mimir: conversation state lives in the [[service]] and the
# panel is only its display layer. A panel's Lua state is destroyed the moment
# it closes, so only the service can keep a conversation alive across open and
# close. The two talk through noctalia.state.
#
# No external dependencies: readFile / writeFile / http are all host
# capabilities.

id = "mayon/ask"
name = "Ask"
version = "2.0.0"
plugin_api = 13  # capture_keys needs >= 13 (the host supports up to 23)
author = "mayon"
license = "MIT"
dependencies = []
tags = ["ai", "chat"]
icon = "message-circle"
description = "Ask an LLM from the bar, with the API key read from a sops secret instead of stored in settings."

# Plugin-level settings: all three entries read them, so they go here rather
# than into [[widget.setting]] -- that one is entry-scoped and invisible to the
# panel and the service (noctalia plugins lint reports such a cross-entry read
# as "reads undeclared setting").
[[setting]]
key = "key_file"
type = "file"
label_key = "settings.key_file.label"
description_key = "settings.key_file.description"
default = "/run/secrets/deepseek-api-key"

[[setting]]
key = "api_base"
type = "string"
label_key = "settings.api_base.label"
default = "https://api.deepseek.com"

# Only the *default* model. The panel header can switch at any time and the
# choice is kept in state.
[[setting]]
key = "model"
type = "select"
label_key = "settings.model.label"
description_key = "settings.model.description"
options = [
  { value = "deepseek-v4-flash", label_key = "settings.model.flash" },
  { value = "deepseek-v4-pro", label_key = "settings.model.pro" },
]
default = "deepseek-v4-flash"

# Both V4 models default to thinking mode. Turning it off saves tokens and is
# a little faster.
[[setting]]
key = "thinking"
type = "bool"
label_key = "settings.thinking.label"
description_key = "settings.thinking.description"
default = true

[[setting]]
key = "reasoning_effort"
type = "select"
label_key = "settings.reasoning_effort.label"
description_key = "settings.reasoning_effort.description"
options = [
  { value = "low", label_key = "settings.reasoning_effort.low" },
  { value = "medium", label_key = "settings.reasoning_effort.medium" },
  { value = "high", label_key = "settings.reasoning_effort.high" },
]
default = "medium"

[[setting]]
key = "system_prompt"
type = "string"
label_key = "settings.system_prompt.label"
description_key = "settings.system_prompt.description"
default = "You are a concise assistant. Answer in the user's language. Prefer short, direct answers."

[[setting]]
key = "max_turns"
type = "int"
label_key = "settings.max_turns.label"
description_key = "settings.max_turns.description"
default = 12

[[setting]]
key = "persist_history"
type = "bool"
label_key = "settings.persist_history.label"
description_key = "settings.persist_history.description"
default = true

[[setting]]
key = "max_conversations"
type = "int"
label_key = "settings.max_conversations.label"
description_key = "settings.max_conversations.description"
default = 30

[[widget]]
id = "bar"
entry = "bar.luau"

# Full-height sidebar on the right. height = "fill" plus position is the same
# spelling notes uses for its full-height side panel.
# capture_keys: the panel takes these two keys for itself, to walk the prompt
# history in the input field the way a shell does. The cost is that the message
# list can no longer be scrolled with Up/Down -- the input keeps focus anyway,
# so the trade is worth it.
[[panel]]
id = "chat"
entry = "chat.luau"
capture_keys = ["Up", "Down"]
width = 480
height = "fill"
placement = "floating"
position = "center_right"

# Headless service: owns the conversation, sends the requests, reads and writes
# history. Runs whether or not the panel is open.
[[service]]
id = "brain"
entry = "service.luau"
