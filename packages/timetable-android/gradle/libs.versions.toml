[versions]
kotlin = "2.0.21"
kotlinx-serialization = "1.7.3"
junit = "4.13.2"
agp = "8.10.1"
compose-bom = "2025.04.01"
activity = "1.10.1"
coroutines = "1.9.0"
glance = "1.1.1"
androidx-core = "1.15.0"
onnx = "1.31.1"
zxing = "3.5.3"
exif = "1.3.7"
test-runner = "1.6.2"
test-junit = "1.2.1"
espresso = "3.6.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnx" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
exif = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
