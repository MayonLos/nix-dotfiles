[package]
name = "seek"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private local document search with cited, explicit question answering"

[workspace]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fastembed = { version = "=5.12.0", default-features = false, features = ["ort-load-dynamic"] }
fs2 = "0.4"
globset = "0.4"
jieba-rs = "0.8"
mayon-ui = { path = "../mayon-tui/crates/ui" }
quick-xml = "0.37"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.25"
tempfile = "3"
toml = "0.8"
url = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
