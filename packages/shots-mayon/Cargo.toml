[package]
name = "shots-mayon"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
mayon-ui = { path = "../mayon-tui/crates/ui" }
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
