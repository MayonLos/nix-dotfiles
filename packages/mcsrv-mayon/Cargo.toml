[package]
name = "mcsrv-mayon"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
url = "2"
tempfile = "3"
fs2 = "0.4"
flate2 = "1"
rand = "0.8"
chrono = "0.4"
crossterm = "0.29"
ratatui = "0.29"
unicode-segmentation = "1.12"
unicode-width = "0.2"
libc = "0.2"

[build-dependencies]
serde_json = "1"
